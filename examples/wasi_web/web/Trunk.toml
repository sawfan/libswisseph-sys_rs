# Trunk config for the minimal static web runner.
#
# This site serves static assets from ./web.
#
# Important: do NOT write build artifacts into the Trunk source dir (./web),
# otherwise Trunk will detect file changes and rebuild in a loop.
#
# Instead:
# - pre_build: build the WASI wasm into ../../target/...
# - post_build: copy the artifact into Trunk’s staging dir so it ends up in dist.

[build]
target = "index.html"
dist = "dist"

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-lc",
  "set -euo pipefail; profile=${TRUNK_PROFILE:-debug}; root=\"$TRUNK_SOURCE_DIR/../../..\"; cd \"$root\"; export CARGO_TARGET_DIR=\"$root/target\"; if [ \"$profile\" = \"release\" ]; then cargo build --manifest-path \"$root/Cargo.toml\" --target wasm32-wasip1 --example wasi_web -q --release; else cargo build --manifest-path \"$root/Cargo.toml\" --target wasm32-wasip1 --example wasi_web -q; fi",
]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-lc",
  "set -euo pipefail; profile=${TRUNK_PROFILE:-debug}; root=\"$TRUNK_SOURCE_DIR/../../..\"; cp \"$root/target/wasm32-wasip1/$profile/examples/wasi_web.wasm\" \"$TRUNK_STAGING_DIR/swisseph_wasi.wasm\"",
]


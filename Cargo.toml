[package]
name = "swisseph-sys"
version = "0.1.2"
links = "swisseph"
build = "build.rs"
edition = "2021"
authors = ["Sawfan <sawfan@sawfan.com>"]
description = "Rust system wrapper for swisseph C library"
repository = "https://github.com/sawfan/libswisseph-sys_rs"
license = "AGPL-3.0-only"
keywords = ["ephemeris", "astronomy", "astrology"]
exclude = [
    "libswisseph/doc",
    "libswisseph/windows",
    "libswisseph/contrib",
    "libswisseph/ephe",
    "libswisseph/test",
]

[features]
default = []
wasi = []
vfs = []

[build-dependencies]
cc = { version = "1.0.43", features = ["parallel"] }
pkg-config = "0.3.15"

